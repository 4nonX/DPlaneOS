name: DPlaneOS Unified CI/CD

on:
  push:
    branches: ["main", "feature/iso-installer"]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 1: PREPARE - Build & Verify
  # ════════════════════════════════════════════════════════════════════════════
  prepare:
    name: Build & Verify
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Syncthing conflict files
        run: |
          CONFLICTS=$(find . -name '.sync-conflict-*.go' 2>/dev/null | head -20 || true)
          if [ -n "$CONFLICTS" ]; then
            echo "ERROR: Syncthing conflict files found - would cause duplicate symbol build failures:"
            echo "$CONFLICTS"
            exit 1
          fi
          echo "No Syncthing conflict files found."

      - name: Set up Node.js
        if: hashFiles('app-react/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-react/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('app-react/package-lock.json') != ''
        working-directory: app-react
        run: npm ci

      - name: TypeScript typecheck
        if: hashFiles('app-react/package-lock.json') != ''
        working-directory: app-react
        run: npx tsc --noEmit

      - name: Frontend lint (eslint)
        if: hashFiles('app-react/package-lock.json') != ''
        working-directory: app-react
        run: npm run lint

      - name: Verify app/ bundle is up to date
        if: hashFiles('app-react/package-lock.json') != ''
        run: |
          cd app-react
          npm run build
          cd ..
          CHANGED=$(git diff --name-only -- app/)
          NEW=$(git ls-files --others --exclude-standard -- app/)
          DELETED=$(git ls-files --deleted -- app/)
          if [ -n "$CHANGED" ] || [ -n "$NEW" ] || [ -n "$DELETED" ]; then
            echo "ERROR: committed app/ bundle is stale - these files differ after rebuilding."
            echo "Run 'npm run build' in app-react/ and commit the updated app/ directory."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libc6-dev postgresql-client gcc-aarch64-linux-gnu qemu-user-static libc6-arm64-cross \
            zfsutils-linux libzfslinux-dev pkg-config

      - name: Run Go Tests
        working-directory: daemon
        env:
          DATABASE_DSN: postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable
        run: go test -v -race ./...

      - name: Vulnerability scan (govulncheck)
        working-directory: daemon
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1 | tee /tmp/vuln.txt; EC=${PIPESTATUS[0]}
          # GO-2026-5970 (golang.org/x/text infinite loop) is an indirect dependency
          # waiting for transitive upgrades to v0.39.0+. All Go stdlib vulnerabilities
          # (crypto/tls, net/textproto, crypto/x509) fixed by nixpkgs 26.05 upgrade.
          KNOWN=1
          FOUND=$(grep -c "^Vulnerability #" /tmp/vuln.txt 2>/dev/null || echo 0)
          if [ "$EC" -ne 0 ] && [ "$FOUND" -gt "$KNOWN" ]; then
            echo "UNEXPECTED VULNERABILITIES (expected $KNOWN tracked, found $FOUND)"
            exit 1
          elif [ "$EC" -ne 0 ]; then
            echo "NOTE: $FOUND known tracked CVE(s) - not blocking"
          fi

      - name: Build binaries (amd64 & arm64)
        working-directory: daemon
        run: |
          mkdir -p ../build
          # CGO_ENABLED=0: portable tarball build, ZFS via subprocess fallback.
          # Used for the release tarballs and as the arm64 binary (no cross-CGO).
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=$(cat ../VERSION)" -o ../build/dplaned-linux-amd64 ./cmd/dplaned/
          GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=$(cat ../VERSION)" -o ../build/dplaned-linux-arm64 ./cmd/dplaned/
          # CGO_ENABLED=1 -tags libzfs: matches the production Nix ISO build path.
          # Uses libzfs C bindings directly instead of spawning ZFS subprocesses.
          # All integration, storage, and HA test jobs run this binary so the
          # tested code path matches what ships on the ISO.
          CGO_ENABLED=1 go build -tags libzfs -ldflags="-s -w -X main.Version=$(cat ../VERSION)" -o ../build/dplaned-linux-amd64-cgo ./cmd/dplaned/

      - name: ARM64 Sanity Check (QEMU)
        run: |
          chmod +x build/dplaned-linux-arm64
          qemu-aarch64-static -L /usr/aarch64-linux-gnu build/dplaned-linux-arm64 --version

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dplaneos-build
          path: |
            build/
            app/
            dplaned-ci

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 2: VALIDATE - Full API Integration Tests
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: API Integration Tests
    needs: prepare
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dplaneos-build

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libc6-dev zfsutils-linux postgresql-client python3-bcrypt curl nfs-kernel-server samba targetcli-fb acl ufw ipmitool
          sudo modprobe zfs

      - name: Positioning binary for scripts
        run: cp build/dplaned-linux-amd64-cgo ./dplaned-ci && chmod +x ./dplaned-ci

      - name: Run API Test Suite
        env:
          CI_PASS: "CiAdmin1!Test"
          DATABASE_DSN: "postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable"
        run: |
          chmod +x .github/scripts/api-integration-test.sh
          bash .github/scripts/api-integration-test.sh

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 3A: HARDEN - Convergence & Failure Resilience
  # ════════════════════════════════════════════════════════════════════════════
  convergence:
    name: Convergence & Resilience
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dplaneos-build

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zfsutils-linux postgresql-client python3-bcrypt
          sudo modprobe zfs

      - name: Positioning binary for scripts
        # Convergence tests exercise fault injection (DPLANE_FAULT_INJECT) which
        # works by intercepting subprocess calls. The CGO binary calls libzfs
        # directly and naturally bypasses that mechanism. The reconciler logic
        # under test is identical in both builds; use the subprocess binary here.
        run: cp build/dplaned-linux-amd64 ./dplaned-ci && chmod +x ./dplaned-ci

      - name: Run Convergence & Resilience Suite
        env:
          DATABASE_DSN: "postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable"
        run: |
          chmod +x .github/scripts/convergence-test.sh
          bash .github/scripts/convergence-test.sh

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 3B: STORAGE FAILURE - Real-World Fault Scenarios
  # Runs in parallel with convergence (both need only validate)
  # ════════════════════════════════════════════════════════════════════════════
  storage-failure:
    name: Storage Failure Scenarios
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dplaneos-build

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zfsutils-linux postgresql-client python3-bcrypt curl python3-bcrypt
          sudo modprobe zfs

      - name: Positioning binary for scripts
        run: cp build/dplaned-linux-amd64-cgo ./dplaned-ci && chmod +x ./dplaned-ci

      - name: Run Storage Failure Suite
        env:
          CI_PASS: "CiAdmin1!Test"
          DATABASE_DSN: "postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable"
        run: |
          chmod +x .github/scripts/storage-failure-test.sh
          bash .github/scripts/storage-failure-test.sh

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 4: INTEGRATE - Full Fleet & Install Tests
  # Requires both Stage 3 jobs to pass
  # ════════════════════════════════════════════════════════════════════════════
  integration:
    name: Fleet & Install Tests
    needs: [prepare, validate, convergence, storage-failure]
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dplaneos-build

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zfsutils-linux postgresql-client python3-bcrypt curl nginx nfs-kernel-server samba acl ufw
          sudo modprobe zfs

      - name: Positioning binary for scripts
        run: cp build/dplaned-linux-amd64-cgo ./dplaned-ci && chmod +x ./dplaned-ci

      - name: Run Fleet/Install Suite
        env:
          CI_PASS: "CiAdmin1!Test"
          DATABASE_DSN: "postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable"
        run: |
          chmod +x .github/scripts/fleet-integration-test.sh
          bash .github/scripts/fleet-integration-test.sh

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 4A: CONFIGURATION SYNC - two nodes with their own databases
  # (Design 0001, Phase 2): pair, partition, change both sides, reconnect,
  # merge, resolve a conflict, detach.
  # ════════════════════════════════════════════════════════════════════════════
  config-sync:
    name: Config Sync & Merge (two nodes)
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dplaneos-build

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zfsutils-linux postgresql-client python3-bcrypt curl samba acl socat iptables
          sudo modprobe zfs

      - name: Positioning binary for scripts
        run: cp build/dplaned-linux-amd64-cgo ./dplaned-ci && chmod +x ./dplaned-ci

      - name: Run two-node sync test
        env:
          DATABASE_DSN: "postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable"
        run: bash .github/scripts/config-sync-test.sh

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 4B: HA CLUSTER TESTS - Failover logic, ZFS promotion, NixOS modules.
  # Three parallel jobs, each gated on prepare. Release and ISO are hard-gated
  # on all three: a broken HA subsystem must never reach a published release.
  # ════════════════════════════════════════════════════════════════════════════
  ha-failover-logic:
    name: HA Failover Logic (real Postgres)
    needs: [prepare]
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U dplaneos; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 2
          done
          echo "ERROR: PostgreSQL did not become ready in time."
          exit 1

      - name: go vet (ha package)
        working-directory: daemon
        run: go vet ./internal/ha/...

      - name: HA failover integration tests
        working-directory: daemon
        env:
          DATABASE_DSN: postgres://dplaneos:dplaneos@127.0.0.1:5432/dplaneos?sslmode=disable
        run: |
          go test -race -count=1 -v ./internal/ha/...

      - name: HA guard-coverage gate
        working-directory: daemon
        env:
          DATABASE_DSN: postgres://dplaneos:dplaneos@127.0.0.1:5432/dplaneos?sslmode=disable
        run: |
          set -euo pipefail
          OUT=$(go test -count=1 -v -run TestFailover ./internal/ha/... 2>&1)
          echo "$OUT"
          for guard in \
            TestFailover_NoFencingConfigured_DoesNotPromote \
            TestFailover_WitnessUnreachable_DoesNotPromote \
            TestFailover_WitnessReachable_ClearsWitnessGate \
            TestFailover_NetworkWitnessUnreachable_DoesNotPromote \
            TestFailover_NetworkWitnessReachable_ClearsGuard \
            TestFailover_MaintenanceMode_SuppressesPromotion \
            TestFailover_HysteresisWindow_SuppressesFlapping \
            TestFailover_SubordinateMode_SuppressesPromotion \
            TestFailover_GuardPriority_SubordinateBeatsHysteresis ; do
            if ! echo "$OUT" | grep -q -- "--- PASS: ${guard}"; then
              echo "ERROR: required HA guard test '${guard}' did not pass."
              echo "A split-brain protection guard is missing or broken."
              exit 1
            fi
          done
          echo "All required HA failover guards passed."

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 4C: ARM64 API TESTS - Behavioral coverage for the arm64 daemon
  # Closes the gap where arm64 was only sanity-checked with --version.
  # Runs the same REST API suite against the arm64 CGO binary on a native
  # arm64 runner. ZFS-specific tests are excluded (kernel module not
  # available on the arm64 GitHub runner); all auth, session, SCRAM,
  # HA config, and directory endpoints are exercised.
  # ════════════════════════════════════════════════════════════════════════════
  arm64-api:
    name: ARM64 API Tests (native runner)
    needs: [prepare, validate]
    runs-on: ubuntu-22.04-arm
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dplaneos
          POSTGRES_USER: dplaneos
          POSTGRES_PASSWORD: dplaneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libc6-dev postgresql-client python3-bcrypt curl ipmitool \
            zfsutils-linux nfs-kernel-server samba acl targetcli-fb
          sudo modprobe zfs

      - name: Build arm64 CGO daemon
        working-directory: daemon
        run: |
          # Build the arm64 CGO daemon natively on the arm64 runner.
          # No libzfs on this runner so we build without -tags libzfs;
          # the subprocess ZFS fallback is used, matching the arm64 tarball.
          # The goal here is behavioral coverage of the REST API surface,
          # not libzfs integration (which is covered by the amd64 CGO tests).
          CGO_ENABLED=1 go build -ldflags="-s -w -X main.Version=$(cat ../VERSION)" \
            -o ../dplaned-ci ./cmd/dplaned/

      - name: Run API Test Suite (arm64)
        env:
          CI_PASS: "CiAdmin1!Test"
          DATABASE_DSN: "postgres://dplaneos:dplaneos@localhost:5432/dplaneos?sslmode=disable"
        run: |
          chmod +x .github/scripts/api-integration-test.sh
          bash .github/scripts/api-integration-test.sh

  ha-promotion-zfs:
    name: HA Promotion Mechanics (real ZFS)
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ZFS and load the kernel module
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          zpool version

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint the HA ZFS test script
        run: shellcheck .github/scripts/ha-promotion-zfs-test.sh

      - name: Run HA promotion ZFS test
        run: sudo bash .github/scripts/ha-promotion-zfs-test.sh

  ha-vm-cluster:
    name: HA NixOS Modules (build + VM test scaffold)
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Pin flake.lock
        run: |
          # Generate (or refresh) flake.lock so every job in this CI run uses
          # the same nixpkgs revision. Without a committed lock file, each job
          # independently resolves nixpkgs HEAD and can get different versions.
          nix flake lock
          echo "Pinned nixpkgs: $(nix flake metadata --json . | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["locks"]["nodes"]["nixpkgs"]["locked"]["rev"])')"

      - name: Commit flake.lock if new or changed
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet flake.lock 2>/dev/null && git ls-files --error-unmatch flake.lock 2>/dev/null; then
            echo "flake.lock unchanged - nothing to commit"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "chore: pin flake.lock [skip ci]"
            git push
            echo "flake.lock committed and pushed"
          fi

      - name: Upload flake.lock artifact for ISO jobs
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock

      - name: Evaluate HA NixOS modules
        run: nix flake check --no-build .

      - name: Two-node failover VM test
        run: |
          echo "NixOS HA modules evaluated successfully."
          echo "VM test (ha-failover.nix) wired in flake checks; enable full"
          echo "run by switching this step to: nix build .#checks.x86_64-linux.ha-failover -L"

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 5C: LIVE BOOT ISO BUILD - Live boot environment (no installation)
  # Parallel build for x86_64 and aarch64
  # ════════════════════════════════════════════════════════════════════════════
  build-live-iso:
    name: Build Live Boot ISO
    needs: [validate, integration, config-sync, ha-failover-logic, ha-promotion-zfs, ha-vm-cluster]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/live-boot'
    strategy:
      matrix:
        include:
          - system: "x86_64-linux"
            runner: "ubuntu-22.04"
            iso_target: "iso-live"
            arch_label: "x86_64"
            artifact_name: "iso-live-x86_64"
          - system: "aarch64-linux"
            runner: "ubuntu-22.04-arm"
            iso_target: "iso-live"
            arch_label: "arm64"
            artifact_name: "iso-live-arm64"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned flake.lock from ha-vm-cluster
        uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: /tmp/flake-lock-artifact

      - name: Install flake.lock in repo root
        run: |
          if [ -f /tmp/flake-lock-artifact/flake.lock ]; then
            cp /tmp/flake-lock-artifact/flake.lock flake.lock
          else
            echo "WARNING: flake.lock artifact not found, continuing"
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Reclaim disk space for Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7  # main

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Verify VERSION matches tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($VERSION)"
              exit 1
            fi
          else
            VERSION="$(cat VERSION | tr -d '[:space:]')"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build live boot ISO (${{ matrix.system }})
        run: |
          nix build ".#${{ matrix.iso_target }}" --print-build-logs
          ls -lh result/iso/

      - name: Package ISO and generate SBOM
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ISO_NAME="dplaneos-v${VERSION}-live-${{ matrix.arch_label }}.iso"
          cp result/iso/*.iso "$ISO_NAME"
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
          echo "iso_sha=${ISO_NAME}.sha256" >> $GITHUB_OUTPUT

          SYSTEM_PATH=$(nix eval --raw ".#nixosConfigurations.dplaneos-live${{ matrix.system == 'aarch64-linux' && '-arm' || '' }}.config.system.build.toplevel" 2>&1)
          if [[ "$SYSTEM_PATH" != /nix/store/* ]]; then
            echo "ERROR: could not resolve dplaneos-live toplevel: $SYSTEM_PATH"; exit 1
          fi
          nix path-info -r "$SYSTEM_PATH" --json | python3 .github/scripts/generate-iso-sbom.py "$ISO_NAME" > "${ISO_NAME}.sbom.json"
          echo "iso_sbom=${ISO_NAME}.sbom.json" >> $GITHUB_OUTPUT

      - name: Upload Live ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.package.outputs.iso_name }}
            ${{ steps.package.outputs.iso_sha }}
            ${{ steps.package.outputs.iso_sbom }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 5D: TEST LIVE BOOT - VM-based integration test for live boot
  # ════════════════════════════════════════════════════════════════════════════
  test-live-boot:
    name: Test Live Boot (VM)
    needs: [prepare]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/live-boot'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Run live boot VM test (x86_64)
        timeout-minutes: 15
        run: |
          nix build .#checks.x86_64-linux.live-boot -L

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 4C: CLUSTER QUORUM - Corosync + third vote on three NixOS VMs
  # (Design 0001 phase 3a). Runs on every ref: it is the exit test of the phase.
  # ════════════════════════════════════════════════════════════════════════════
  quorum-vm:
    name: Cluster Quorum and Storage Groups (VMs)
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm

      - name: Run quorum VM test
        timeout-minutes: 60
        run: nix build .#checks.x86_64-linux.quorum -L

      - name: Run storage groups VM test (shared disk)
        timeout-minutes: 60
        run: nix build .#checks.x86_64-linux.groups -L

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 5: RELEASE - Professional Build & Publish
  # ════════════════════════════════════════════════════════════════════════════
  release:
    name: Build & Publish Release
    needs: [validate, integration, config-sync, quorum-vm, convergence, storage-failure, ha-failover-logic, ha-promotion-zfs, ha-vm-cluster, iso, iso-arm, build-live-iso, test-live-boot]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Populate vendor directory
        working-directory: daemon
        run: go mod vendor

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dplaneos-build

      - name: Prepare Release Metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($VERSION)"
              exit 1
            fi
          else
            echo "Non-tag trigger: using version from file ($FILE_VERSION)"
            VERSION="$FILE_VERSION"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          python3 .github/scripts/extract-release-notes.py "$VERSION" docs/reference/CHANGELOG.md > /tmp/release-notes.md
          HEADER=$(grep "^## v\?${VERSION}" docs/reference/CHANGELOG.md | head -1)
          CODENAME=$(echo "$HEADER" | sed 's/.*- "\(.*\)"/\1/' || echo "Release")
          DATE=$(echo "$HEADER" | grep -oP '\d{4}-\d{2}-\d{2}' | head -1 || date +%Y-%m-%d)
          RELEASE_TITLE="v${VERSION} (${DATE}) - \"${CODENAME}\""
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

          # amd64
          AMD64_TARBALL="dplaneos-v${VERSION}-linux-amd64.tar.gz"
          cp build/dplaned-linux-amd64 build/dplaned
          tar czf "$AMD64_TARBALL" --transform="s|^|dplaneos-v${VERSION}/|" \
            --exclude='*.bak' --exclude='.git' \
            app/ build/dplaned daemon/ install/ nixos/ docs/ \
            .github/ .gitattributes .gitignore install.sh scripts/ .gitmodules Makefile VERSION LICENSE README.md CONTRIBUTING.md \
            docs/legal/ docs/assets/ SECURITY.md

          # arm64
          ARM64_TARBALL="dplaneos-v${VERSION}-linux-arm64.tar.gz"
          cp build/dplaned-linux-arm64 build/dplaned
          tar czf "$ARM64_TARBALL" --transform="s|^|dplaneos-v${VERSION}/|" \
            --exclude='*.bak' --exclude='.git' \
            app/ build/dplaned daemon/ install/ nixos/ docs/ \
            .github/ .gitattributes .gitignore install.sh scripts/ .gitmodules Makefile VERSION LICENSE README.md CONTRIBUTING.md \
            docs/legal/ docs/assets/ SECURITY.md

          echo "amd64_tarball=${AMD64_TARBALL}" >> $GITHUB_OUTPUT
          echo "arm64_tarball=${ARM64_TARBALL}" >> $GITHUB_OUTPUT

          sha256sum "$AMD64_TARBALL" > "$AMD64_TARBALL.sha256"
          sha256sum "$ARM64_TARBALL" > "$ARM64_TARBALL.sha256"

          echo "amd64_sha=${AMD64_TARBALL}.sha256" >> $GITHUB_OUTPUT
          echo "arm64_sha=${ARM64_TARBALL}.sha256" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0

      - name: Sign tarballs and generate SBOMs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          AMD64="${{ steps.meta.outputs.amd64_tarball }}"
          ARM64="${{ steps.meta.outputs.arm64_tarball }}"

          cosign sign-blob --yes "$AMD64" --bundle "${AMD64}.bundle"
          cosign sign-blob --yes "$ARM64" --bundle "${ARM64}.bundle"

          syft scan "$AMD64" -o spdx-json="${AMD64}.sbom.json"
          syft scan "$ARM64" -o spdx-json="${ARM64}.sbom.json"

      - name: Download ISO artifacts from build jobs
        uses: actions/download-artifact@v4
        with:
          pattern: iso-*
          merge-multiple: true
          path: iso-artifacts

      - name: Download live ISO artifacts from build jobs
        uses: actions/download-artifact@v4
        with:
          pattern: iso-live-*
          merge-multiple: true
          path: iso-live-artifacts

      - name: Sign ISOs (installer)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for ISO in iso-artifacts/*.iso; do
            [ -f "$ISO" ] || continue
            cosign sign-blob --yes "$ISO" --bundle "${ISO}.bundle"
          done

      - name: Sign ISOs (live boot)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for ISO in iso-live-artifacts/*.iso; do
            [ -f "$ISO" ] || continue
            cosign sign-blob --yes "$ISO" --bundle "${ISO}.bundle"
          done

      - name: Scan all SBOMs for CVEs (grype)
        run: |
          # Install grype - the SBOM consumer that makes generation meaningful.
          # A generated SBOM that is never scanned attests to nothing actionable.
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          echo "=== Tarball SBOMs ==="
          for SBOM in *.sbom.json; do
            [ -f "$SBOM" ] || continue
            echo "Scanning $SBOM..."
            grype "sbom:$SBOM" --output table --fail-on critical || {
              echo "CRITICAL CVEs found in $SBOM - see table above"
              exit 1
            }
          done
          echo "=== ISO closure SBOMs ==="
          for SBOM in iso-artifacts/*.sbom.json; do
            [ -f "$SBOM" ] || continue
            PKG_COUNT=$(python3 -c "import json; d=json.load(open('$SBOM')); print(len(d['packages']))" 2>/dev/null || echo "?")
            echo "Scanning $SBOM ($PKG_COUNT packages)..."
            grype "sbom:$SBOM" --output table --fail-on critical || {
              echo "CRITICAL CVEs found in $SBOM - see table above"
              exit 1
            }
          done

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.title }}
          body_path: /tmp/release-notes.md
          files: |
            ${{ steps.meta.outputs.amd64_tarball }}
            ${{ steps.meta.outputs.amd64_sha }}
            ${{ steps.meta.outputs.amd64_tarball }}.bundle
            ${{ steps.meta.outputs.amd64_tarball }}.sbom.json
            ${{ steps.meta.outputs.arm64_tarball }}
            ${{ steps.meta.outputs.arm64_sha }}
            ${{ steps.meta.outputs.arm64_tarball }}.bundle
            ${{ steps.meta.outputs.arm64_tarball }}.sbom.json
            iso-artifacts/*.iso
            iso-artifacts/*.sha256
            iso-artifacts/*.bundle
            iso-artifacts/*.sbom.json
            iso-live-x86_64/*.iso
            iso-live-x86_64/*.sha256
            iso-live-x86_64/*.sbom.json
            iso-live-arm64/*.iso
            iso-live-arm64/*.sha256
            iso-live-arm64/*.sbom.json
          draft: true
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iso:
    name: Build Installer ISO
    needs: [validate, integration, config-sync, ha-failover-logic, ha-promotion-zfs, ha-vm-cluster]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/iso-installer'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned flake.lock from ha-vm-cluster
        uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: /tmp/flake-lock-artifact

      - name: Install flake.lock in repo root
        run: |
          if [ -f /tmp/flake-lock-artifact/flake.lock ]; then
            cp /tmp/flake-lock-artifact/flake.lock flake.lock
            echo "flake.lock installed ($(wc -c < flake.lock) bytes)"
          else
            echo "WARNING: artifact did not contain flake.lock at expected path"
            ls -la /tmp/flake-lock-artifact/ || true
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Reclaim disk space for Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7  # main

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Report available disk space
        run: df -h /

      - name: Verify VERSION matches tag (Tags only)
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($VERSION)"
              exit 1
            fi
          else
            VERSION="$(cat VERSION | tr -d '[:space:]')"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build installer ISO
        run: |
          nix build .#iso --print-build-logs
          ls -lh result/iso/

      - name: Package ISO and generate closure SBOM
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ISO_NAME="dplaneos-v${VERSION}-installer-amd64.iso"
          cp result/iso/*.iso "$ISO_NAME"
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
          echo "iso_sha=${ISO_NAME}.sha256" >> $GITHUB_OUTPUT

          # Generate SBOM from the Nix closure (not the opaque ISO image).
          # See .github/scripts/generate-iso-sbom.py for full rationale.
          # The result symlink points to the ISO image file, whose Nix closure
          # is just the ISO derivation itself - the squashfs content is embedded,
          # not tracked as store dependencies. Query the system toplevel that was
          # baked into the squashfs; its closure is the full package inventory.
          # nix eval --raw coerces the derivation to its outPath (/nix/store/...).
          # The store paths are already present (built during nix build .#iso above)
          # so this is just a metadata lookup, not a rebuild.
          SYSTEM_PATH=$(nix eval --raw ".#nixosConfigurations.dplaneos-for-iso.config.system.build.toplevel" 2>&1)
          echo "System toplevel: $SYSTEM_PATH"
          if [[ "$SYSTEM_PATH" != /nix/store/* ]]; then
            echo "ERROR: could not resolve dplaneos-for-iso toplevel: $SYSTEM_PATH"; exit 1
          fi
          nix path-info -r "$SYSTEM_PATH" --json | python3 .github/scripts/generate-iso-sbom.py "$ISO_NAME" > "${ISO_NAME}.sbom.json"
          echo "SBOM: $(python3 -c "import json; d=json.load(open('${ISO_NAME}.sbom.json')); print(len(d['packages']),'packages')" 2>/dev/null)"
          echo "iso_sbom=${ISO_NAME}.sbom.json" >> $GITHUB_OUTPUT

      - name: Upload ISO artifact for signing in release job
        uses: actions/upload-artifact@v4
        with:
          name: iso-amd64
          path: |
            ${{ steps.package.outputs.iso_name }}
            ${{ steps.package.outputs.iso_sha }}
            ${{ steps.package.outputs.iso_sbom }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 5B: ISO ARM64 - Combined installer for aarch64 clusters
  # Native arm64 runner ensures the DPlaneOS closure is built for the right
  # architecture and baked into the ISO correctly.
  # ════════════════════════════════════════════════════════════════════════════
  iso-arm:
    name: Build Installer ISO (arm64)
    needs: [validate, integration, config-sync, ha-failover-logic, ha-promotion-zfs, ha-vm-cluster]
