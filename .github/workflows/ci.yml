          cp result/iso/*.iso "$ISO_NAME"
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
          echo "iso_sha=${ISO_NAME}.sha256" >> $GITHUB_OUTPUT

          # The result symlink points to the ISO image file, whose Nix closure
          # is just the ISO derivation itself - the squashfs content is embedded,
          # not tracked as store dependencies. Query the system toplevel that was
          # baked into the squashfs; its closure is the full package inventory.
          SYSTEM_PATH=$(nix eval --raw ".#nixosConfigurations.dplaneos-arm.config.system.build.toplevel" 2>&1)
          echo "System toplevel: $SYSTEM_PATH"
          if [[ "$SYSTEM_PATH" != /nix/store/* ]]; then
            echo "ERROR: could not resolve dplaneos-arm toplevel: $SYSTEM_PATH"; exit 1
          fi
          nix path-info -r "$SYSTEM_PATH" --json | python3 .github/scripts/generate-iso-sbom.py "$ISO_NAME" > "${ISO_NAME}.sbom.json"
          echo "SBOM: $(python3 -c "import json; d=json.load(open('${ISO_NAME}.sbom.json')); print(len(d['packages']),'packages')" 2>/dev/null)"
          echo "iso_sbom=${ISO_NAME}.sbom.json" >> $GITHUB_OUTPUT

      - name: Upload arm64 ISO artifact for signing in release job
        uses: actions/upload-artifact@v4
        with:
          name: iso-arm64
          path: |
            ${{ steps.package.outputs.iso_name }}
            ${{ steps.package.outputs.iso_sha }}
            ${{ steps.package.outputs.iso_sbom }}

