# prometheus/ha-alerts.yml
# DPlaneOS cluster and storage-group alerts.
#
# Metrics come from GET /api/metrics on each node (see
# internal/handlers/prometheus.go):
#   dplaneos_ha_enabled, dplaneos_ha_quorum, dplaneos_ha_expected_votes,
#   dplaneos_ha_online_nodes, dplaneos_ha_auto_failover,
#   dplaneos_ha_self_fence_armed,
#   dplaneos_group_owner_here, dplaneos_group_serving, dplaneos_group_epoch,
#   dplaneos_group_problems  (labels: group, topology)

groups:
  - name: dplaneos-ha
    interval: 30s
    rules:

      - alert: DPlaneOSClusterNotQuorate
        expr: dplaneos_ha_enabled == 1 and dplaneos_ha_quorum == 0
        for: 1m
        labels:
          severity: critical
          component: ha
        annotations:
          summary: "{{ $labels.instance }} is not in the quorate partition"
          description: |
            The node cannot see enough cluster members (or the third vote) to
            have quorum. If it owns a storage group and the watchdog is
            enabled, it resets itself so another node can take over. Check the
            network between the nodes and the third vote.

      - alert: DPlaneOSSelfFenceArmed
        expr: dplaneos_ha_self_fence_armed == 1
        labels:
          severity: critical
          component: ha
        annotations:
          summary: "{{ $labels.instance }} lost quorum while owning storage and is about to reset"
          description: |
            The node stopped resetting its watchdog; the kernel resets it after
            the watchdog timeout and another node takes its storage groups over.

      - alert: DPlaneOSNoAutomaticFailover
        expr: dplaneos_ha_enabled == 1 and dplaneos_ha_quorum == 1 and dplaneos_ha_auto_failover == 0
        for: 15m
        labels:
          severity: warning
          component: ha
        annotations:
          summary: "Automatic failover is not available on {{ $labels.instance }}"
          description: |
            The cluster has no third vote (or it is not voting). Everything
            works, but if a storage owner fails, an operator has to use
            Take over. Add or repair the third vote (HA page, Cluster).

      - alert: DPlaneOSClusterMemberMissing
        expr: dplaneos_ha_enabled == 1 and dplaneos_ha_online_nodes < 2
        for: 5m
        labels:
          severity: warning
          component: ha
        annotations:
          summary: "{{ $labels.instance }} sees no other cluster member"
          description: |
            The other node(s) of the cluster are not in this node's partition.

      - alert: DPlaneOSGroupNotServed
        expr: dplaneos_group_owner_here == 1 and dplaneos_group_serving == 0
        for: 2m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "Storage group {{ $labels.group }} is owned by {{ $labels.instance }} but not served"
          description: |
            The owner has no quorum or the group's pools are not imported.
            The group's line on the HA page says why.

      - alert: DPlaneOSGroupProblems
        expr: dplaneos_group_problems > 0
        for: 10m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "Storage group {{ $labels.group }} reports problems on {{ $labels.instance }}"
          description: |
            See the group's line on the HA page (replication, apps, floating
            address, pools waiting to be imported).

      - alert: DPlaneOSGroupOwnerChanged
        expr: changes(dplaneos_group_epoch[10m]) > 0
        labels:
          severity: info
          component: storage
        annotations:
          summary: "Storage group {{ $labels.group }} changed owner"
          description: |
            A planned move, failover or takeover happened in the last 10 minutes.
